name: Recover previous source transfer
on:
  push:
    branches: [feat/parity-kernel]
    paths: [.github/workflows/recover-source-chunks.yml]
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Read existing repository blobs without modifying source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/recovered-source"
          export OUTPUT="$RUNNER_TEMP/recovered-source"
          python3 - <<'PY'
          import base64,hashlib,json,os,pathlib,urllib.request
          hashes=['912ef8f9c6ed94b5c9cef898c9ca0addd907d0e9','51adcb28b853dc269d3e3628e226920ccf7b659c','d57c74100a2738bde92704ff48cb369a791ba67a','cab94d8c53cf07d7270d6b8dcbf47e3ba7d6ee50','e963321c814100f5c7f58e034606ad1a9dfc5788','c8a3709eef34432d3d1810b6a6177d1490554af4','4f68c93e082e8d3d2261975b310e091ef1c1f20a']
          output=pathlib.Path(os.environ['OUTPUT'])
          for i,sha in enumerate(hashes):
              request=urllib.request.Request('https://api.github.com/repos/wieslawsoltes/NurbsScene/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(request) as response: blob=json.load(response)
              data=base64.b64decode(blob['content'])
              actual=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              if actual!=sha: raise ValueError('Git blob checksum mismatch')
              (output/f'{i:02}.b64').write_bytes(data)
              print(i,sha,len(data))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: recovered-source-fragments
          retention-days: 1
          path: ${{ runner.temp }}/recovered-source/
