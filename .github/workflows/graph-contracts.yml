name: Typed data trees and graph contracts
on:
  pull_request:
  push:
    branches: [main, feat/parity-kernel]
permissions:
  contents: read
jobs:
  graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Run typed paths, sparse trees and indexed graph regressions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/graph-contracts
          dotnet run --project tests/dotnet/NurbsScene.GraphContracts -c Release 2>&1 | tee artifacts/graph-contracts/test.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: graph-contracts-${{ github.run_id }}
          path: artifacts/graph-contracts/
