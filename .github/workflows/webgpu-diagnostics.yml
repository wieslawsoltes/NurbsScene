name: Temporary WebGPU startup evidence inspection
on:
  pull_request:
permissions:
  contents: read
  actions: read
jobs:
  inspect-recorded-startup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: wieslawsoltes/NurbsScene
          run-id: 43106791232
          name: uno-campaign-43106791232-typography
          path: previous-evidence/
      - name: Print the recorded startup failure without rerunning or modifying the app
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path("previous-evidence")
          for name in ("uno-console.json", "uno-browser-typography.json", "uno-campaign-typography.json"):
              path = root / name
              print(name, flush=True)
              print(path.read_text()[:160000], flush=True)
          PY
