name: Surface analysis and native allocation contracts
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOTNET_TieredCompilation: '0'
      NURBSSCENE_NATIVE_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independent surface reference integrals and native kernel
        run: |
          python -m pip install 'numpy>=1.26,<3' 'scipy>=1.12,<2'
          python tools/generate-area-oracle.py
          cmake -S native/kernel -B artifacts/native -DCMAKE_BUILD_TYPE=Release
          cmake --build artifacts/native --parallel
      - name: Area, centroid, cache, native span and allocation regressions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/analysis
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/artifacts/native:${LD_LIBRARY_PATH:-}"
          dotnet run --project tests/dotnet/NurbsScene.AnalysisContracts -c Release 2>&1 | tee artifacts/analysis/contracts.log
      - name: Compare the same native workload on previous main and candidate
        shell: bash
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/artifacts/native:${LD_LIBRARY_PATH:-}"
          baseline="$RUNNER_TEMP/nurbsscene-native-baseline"
          git worktree add --detach "$baseline" 876f21c675eefaff83b0b48ccb96de06d6a92c7f
          mkdir -p "$baseline/tests/native-performance"
          cp tests/native-performance/*.cs tests/native-performance/*.csproj "$baseline/tests/native-performance/"
          dotnet run --project "$baseline/tests/native-performance" -c Release -- "$GITHUB_WORKSPACE/artifacts/analysis/baseline.json"
          dotnet run --project tests/native-performance -c Release -- "$GITHUB_WORKSPACE/artifacts/analysis/candidate.json"
          git rev-parse HEAD HEAD^{tree} > artifacts/analysis/tested-revision.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analysis-${{ github.run_id }}
          path: artifacts/analysis/
