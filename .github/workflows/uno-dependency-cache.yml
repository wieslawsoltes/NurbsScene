name: Offline Uno build dependencies
on:
  push:
    branches: [feat/parity-kernel]
    paths: [.github/workflows/uno-dependency-cache.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install browser build workload
        run: dotnet workload install wasm-tools
      - name: Restore Uno project dependencies only
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore src/NurbsScene.App/NurbsScene.App.csproj --packages "$RUNNER_TEMP/uno-packages"
      - name: Prepare offline compiler dependencies without font files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/uno-offline"
          tar --exclude='*.nupkg' --exclude='*.ttf' --exclude='*.otf' --exclude='*.woff' --exclude='*.woff2' --exclude='*.ttc' -czf "$RUNNER_TEMP/uno-offline/uno-nuget-expanded.tar.gz" -C "$RUNNER_TEMP/uno-packages" .
          root="$(dirname "$(readlink -f "$(command -v dotnet)")")"
          tar -czf "$RUNNER_TEMP/uno-offline/dotnet-workload-packs.tar.gz" -C "$root" packs sdk-manifests metadata
          dotnet --info > "$RUNNER_TEMP/uno-offline/dotnet-info.txt"
          dotnet workload list > "$RUNNER_TEMP/uno-offline/workloads.txt"
          cd "$RUNNER_TEMP/uno-offline"
          sha256sum *.tar.gz > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: uno-offline-build-dependencies
          compression-level: 0
          retention-days: 1
          path: ${{ runner.temp }}/uno-offline/
