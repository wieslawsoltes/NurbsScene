name: Uno application build and browser qualification
on:
  push:
    branches: [main, feat/parity-kernel]
  pull_request:
permissions:
  contents: read
jobs:
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build the real Uno desktop application
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/uno-desktop
          dotnet build src/NurbsScene.App -c Release -f net10.0-desktop -p:NurbsSceneDesktopOnly=true 2>&1 | tee artifacts/uno-desktop/build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uno-desktop-build-${{ github.run_id }}
          path: artifacts/uno-desktop/
  browser-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      campaigns: ${{ steps.registry.outputs.campaigns }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source and all-campaign gate contracts
        run: python -m unittest discover -s tests/browser -p 'test_qualification_contracts.py' -v
      - name: Read the mandatory campaign registry
        id: registry
        shell: bash
        run: |
          set -euo pipefail
          campaigns=$(python tools/uno-qualification.py matrix)
          printf 'campaigns=%s\n' "$campaigns" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet workload install wasm-tools
      - name: Compile the single shared Uno WebAssembly publication
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          dotnet publish src/NurbsScene.App -c Release -f net10.0-browserwasm -p:NurbsSceneQualification=true 2>&1 | tee evidence/uno-build.log
          python tools/stage-uno-site.py
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python tools/uno-qualification.py create --site artifacts/site --commit "$GITHUB_SHA" --tree "$(git rev-parse HEAD^{tree})"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uno-browser-build-${{ github.run_id }}
          path: evidence/
      - uses: actions/upload-artifact@v4
        with:
          # Candidate only: no failed/partial campaign set can publish a qualified site.
          name: candidate-uno-browser-${{ github.sha }}
          path: artifacts/site/
          include-hidden-files: true
          retention-days: 3
  browser:
    needs: browser-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        campaign: ${{ fromJSON(needs.browser-build.outputs.campaigns) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: candidate-uno-browser-${{ github.sha }}
          path: artifacts/site/
      - name: Verify every publication byte and exact tested revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python tools/uno-qualification.py verify --site artifacts/site --commit "$GITHUB_SHA" --tree "$(git rev-parse HEAD^{tree})" --evidence evidence
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Observation handoff unit contracts
        run: python -m unittest discover -s tests/browser -p 'test_observation*contracts.py' -v
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Real Uno browser and framebuffer regressions
        shell: bash
        env:
          CAMPAIGN: ${{ matrix.campaign }}
        run: |
          set -euo pipefail
          python -m http.server 8766 --bind 127.0.0.1 --directory artifacts/site > evidence/http.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          python tests/browser/test_uno.py --campaign "$CAMPAIGN"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uno-campaign-${{ github.run_id }}-${{ matrix.campaign }}
          path: evidence/
          retention-days: 7
  browser-qualification:
    needs: [desktop, browser-build, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: candidate-uno-browser-${{ github.sha }}
          path: artifacts/site/
      - uses: actions/download-artifact@v4
        with:
          pattern: uno-campaign-${{ github.run_id }}-*
          path: campaign-evidence/
      - name: Require every native campaign on the identical publication
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python tools/uno-qualification.py collect --site artifacts/site --commit "$GITHUB_SHA" --tree "$(git rev-parse HEAD^{tree})" --evidence campaign-evidence --output qualified-evidence
      - uses: actions/upload-artifact@v4
        with:
          name: uno-browser-evidence-${{ github.run_id }}
          path: qualified-evidence/
      - uses: actions/upload-artifact@v4
        with:
          name: qualified-uno-browser-${{ github.sha }}
          path: artifacts/site/
          include-hidden-files: true
