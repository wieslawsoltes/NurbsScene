name: Uno application build and browser qualification
on:
  push:
    branches: [main, feat/parity-kernel]
  pull_request:
permissions:
  contents: read
jobs:
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install the native X11 and software Vulkan runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth dbus-x11 libx11-6 libxrandr2 libxi-dev libxcursor1 libfontconfig1 libvulkan1 mesa-vulkan-drivers vulkan-tools
      - name: Build the real Uno desktop application
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/uno-desktop
          dotnet build src/NurbsScene.App -c Release -f net10.0-desktop -p:NurbsSceneDesktopOnly=true -p:NurbsSceneDesktopQualification=true 2>&1 | tee artifacts/uno-desktop/build.log
      - name: WebGPU camera, ABI and render math contracts
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --project tests/dotnet/NurbsScene.WebGpuContracts -c Release 2>&1 | tee artifacts/uno-desktop/webgpu-contracts.log
      - name: Execute the real Uno desktop on software Vulkan
        shell: bash
        env:
          UNO_WEBGPU_BACKENDS: vulkan
          UNO_WEBGPU_LOG: warn
          NURBSSCENE_DESKTOP_QUALIFICATION_OUTPUT: artifacts/uno-desktop/native-webgpu.json
        run: |
          set -euo pipefail
          git rev-parse HEAD > artifacts/uno-desktop/tested-commit.txt
          git rev-parse HEAD^{tree} > artifacts/uno-desktop/tested-tree.txt
          shopt -s nullglob
          lavapipe_icds=(/usr/share/vulkan/icd.d/lvp_icd*.json)
          test "${#lavapipe_icds[@]}" -eq 1
          export VK_DRIVER_FILES="${lavapipe_icds[0]}"
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/nurbsscene-native-runtime"
          export XDG_DATA_HOME="$RUNNER_TEMP/nurbsscene-native-data"
          mkdir -p "$XDG_RUNTIME_DIR" "$XDG_DATA_HOME"
          chmod 700 "$XDG_RUNTIME_DIR"
          xvfb-run -a -s "-screen 0 1280x900x24 -nolisten tcp" vulkaninfo --summary > artifacts/uno-desktop/vulkan-adapter.txt 2>&1
          # Lavapipe executes the production native WGSL/WebGPU path on a CPU.
          # This is correctness evidence, with no hardware performance claim.
          timeout --signal=TERM --kill-after=15s 420s \
            xvfb-run -a -s "-screen 0 1280x900x24 -nolisten tcp" \
            dbus-run-session -- \
            dotnet run --project src/NurbsScene.App -c Release -f net10.0-desktop \
              --no-build --no-restore -p:NurbsSceneDesktopOnly=true -p:NurbsSceneDesktopQualification=true \
            2>&1 | tee artifacts/uno-desktop/native-webgpu.log
          python3 - <<'PY'
          import json, os, pathlib, re
          directory = pathlib.Path("artifacts/uno-desktop")
          output = directory / "native-webgpu.json"
          report = json.loads(output.read_text())
          log = (directory / "native-webgpu.log").read_text()
          assert report["status"] == "passed", report
          assert report["windowClosed"] is True, "The native window did not close normally"
          assert report["commit"] == os.environ["GITHUB_SHA"], "Wrong tested commit"
          adapters = re.findall(r"\[webgpu\] init device[^\n]*adapter='([^'\n]+)' backend=(\w+) type=(\w+)", log)
          assert adapters and all(backend == "Vulkan" and kind == "Cpu" for _, backend, kind in adapters), adapters
          errors = re.findall(r"(?im)^.*(?:\[webgpu\] uncaptured error|\[webgpu\] device lost|\[wgpu Error\]|NURBSSCENE_UNHANDLED:|NURBSSCENE_WEBGPU:).*$", log)
          assert not errors, errors
          report["adapterEvidence"] = {
              "source": "Uno native WebGPU device initialization log",
              "adapters": [dict(description=name, backend=backend, type=kind) for name, backend, kind in adapters],
              "softwareCorrectnessOnly": True,
          }
          output.write_text(json.dumps(report, indent=2) + "\n")
          print(json.dumps(report, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uno-desktop-build-${{ github.run_id }}
          path: artifacts/uno-desktop/
  webgpu-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright numpy==2.3.5
      - run: python -m playwright install --with-deps chromium
      - name: Reproduce the shared HDR environment integration
        run: python tools/bake-studio-environment.py --check
      - name: Compile and execute the production WGSL pipelines
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          git rev-parse HEAD > evidence/tested-commit.txt
          git rev-parse HEAD^{tree} > evidence/tested-tree.txt
          python tests/browser/test_webgpu_pipeline.py --software 2>&1 | tee evidence/webgpu-pipeline.log
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the real reusable NURBS kernel and check shared shader contracts
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang lld cmake
          npm ci --offline --ignore-scripts
          bash tools/build-kernel.sh
          node --test tests/graphics-*.test.mjs 2>&1 | tee evidence/javascript-webgpu-contracts.log
      - name: Execute reusable WebGPU package and real NURBS framebuffer qualification
        shell: bash
        run: |
          set -euo pipefail
          python tests/browser/test_gpu.py --software --output evidence/javascript-webgpu.json 2>&1 | tee evidence/javascript-webgpu.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webgpu-pipeline-${{ github.run_id }}
          path: evidence/
          retention-days: 7
  browser-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      campaigns: ${{ steps.registry.outputs.campaigns }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source and all-campaign gate contracts
        run: python -m unittest discover -s tests/browser -p 'test_qualification_contracts.py' -v
      - name: Read the mandatory campaign registry
        id: registry
        shell: bash
        run: |
          set -euo pipefail
          campaigns=$(python tools/uno-qualification.py matrix)
          printf 'campaigns=%s\n' "$campaigns" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet workload install wasm-tools
      - name: Compile the single shared Uno WebAssembly publication
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          dotnet publish src/NurbsScene.App -c Release -f net10.0-browserwasm -p:NurbsSceneQualification=true 2>&1 | tee evidence/uno-build.log
          python tools/stage-uno-site.py
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python tools/uno-qualification.py create --site artifacts/site --commit "$GITHUB_SHA" --tree "$(git rev-parse HEAD^{tree})"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uno-browser-build-${{ github.run_id }}
          path: evidence/
      - uses: actions/upload-artifact@v4
        with:
          # Candidate only: no failed/partial campaign set can publish a qualified site.
          name: candidate-uno-browser-${{ github.sha }}
          path: artifacts/site/
          include-hidden-files: true
          retention-days: 3
  browser:
    needs: browser-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        campaign: ${{ fromJSON(needs.browser-build.outputs.campaigns) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: candidate-uno-browser-${{ github.sha }}
          path: artifacts/site/
      - name: Verify every publication byte and exact tested revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python tools/uno-qualification.py verify --site artifacts/site --commit "$GITHUB_SHA" --tree "$(git rev-parse HEAD^{tree})" --evidence evidence
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Observation handoff unit contracts
        run: python -m unittest discover -s tests/browser -p 'test_observation*contracts.py' -v
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Real Uno browser and framebuffer regressions
        shell: bash
        env:
          CAMPAIGN: ${{ matrix.campaign }}
          # Use SwiftShader consistently for Dawn/ANGLE/canvas SharedImage interop.
          # A forced WebGPU-only adapter loses the canvas device: Chromium issue 575926500.
          # Hosted runners validate the real WGSL/WebGPU path on SwiftShader.
          # This is correctness evidence, not a hardware GPU performance result.
          NURBSSCENE_CHROMIUM_ARGS: '["--enable-unsafe-webgpu","--use-angle=swiftshader","--enable-unsafe-swiftshader","--use-vulkan=swiftshader","--enable-features=Vulkan"]'
        run: |
          set -euo pipefail
          python -m http.server 8766 --bind 127.0.0.1 --directory artifacts/site > evidence/http.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          python tests/browser/test_uno.py --campaign "$CAMPAIGN"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uno-campaign-${{ github.run_id }}-${{ matrix.campaign }}
          path: evidence/
          retention-days: 7
  browser-qualification:
    needs: [desktop, webgpu-pipeline, browser-build, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: candidate-uno-browser-${{ github.sha }}
          path: artifacts/site/
      - uses: actions/download-artifact@v4
        with:
          pattern: uno-campaign-${{ github.run_id }}-*
          path: campaign-evidence/
      - name: Require every native campaign on the identical publication
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python tools/uno-qualification.py collect --site artifacts/site --commit "$GITHUB_SHA" --tree "$(git rev-parse HEAD^{tree})" --evidence campaign-evidence --output qualified-evidence
      - uses: actions/upload-artifact@v4
        with:
          name: uno-browser-evidence-${{ github.run_id }}
          path: qualified-evidence/
      - uses: actions/upload-artifact@v4
        with:
          name: qualified-uno-browser-${{ github.sha }}
          path: artifacts/site/
          include-hidden-files: true
