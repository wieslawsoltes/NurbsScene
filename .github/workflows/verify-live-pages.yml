name: Verify deployed Uno alpha
on:
  push:
    branches: [verify/pages-f0bd8e3]
    paths: [.github/workflows/verify-live-pages.yml]
permissions:
  contents: read
jobs:
  deployed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f0bd8e33f4a70c52a6865697baae126d2bc9ee9e
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Verify the public deployed revision and application shell
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 - <<'PY'
          import json,pathlib,urllib.request
          base='https://wieslawsoltes.github.io/NurbsScene/'
          with urllib.request.urlopen(base+'deployed-revision.json',timeout=30) as response:
              data=json.load(response)
          if data.get('application')!='Uno Platform' or data.get('commit')!='f0bd8e33f4a70c52a6865697baae126d2bc9ee9e':
              raise RuntimeError('The public site is not the tested merge revision: '+str(data))
          with urllib.request.urlopen(base,timeout=30) as response:
              html=response.read().decode('utf-8')
          if 'uno' not in html.lower(): raise RuntimeError('Missing Uno application shell')
          pathlib.Path('evidence/deployed-revision.json').write_text(json.dumps(data,indent=2))
          print(json.dumps(data,indent=2))
          PY
      - name: Run the same real managed and framebuffer checks against GitHub Pages
        run: python tests/browser/test_uno.py --url https://wieslawsoltes.github.io/NurbsScene/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployed-uno-f0bd8e3-evidence
          path: evidence/
