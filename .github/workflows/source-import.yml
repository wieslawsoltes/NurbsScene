name: Verified source transfer
on:
  push:
    branches: [feat/parity-kernel]
    paths: [.source-import/plan.json]
permissions:
  contents: write
concurrency:
  group: nurbsscene-source-transfer
  cancel-in-progress: false
jobs:
  transfer:
    if: github.repository == 'wieslawsoltes/NurbsScene' && github.ref == 'refs/heads/feat/parity-kernel'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Verify exact parent and manifested file hashes
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feat/parity-kernel
          test "$(git rev-parse origin/feat/parity-kernel)" = "$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/source-transfer"
          python .source-import/apply.py | tee "$RUNNER_TEMP/source-transfer/verification.json"
      - name: Commit verified source and fast-forward the authorized feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'NurbsScene source import'
          git config user.email 'nurbsscene@users.noreply.github.com'
          git diff --cached --quiet && { echo 'No source changes'; exit 1; }
          git commit -m 'feat: apply checksum-verified preserved source and browser interoperability corrections'
          git push origin HEAD:refs/heads/feat/parity-kernel
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/source-transfer/revision.txt"
          git show --stat --oneline HEAD > "$RUNNER_TEMP/source-transfer/commit.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-transfer-${{ github.run_id }}
          path: ${{ runner.temp }}/source-transfer/
