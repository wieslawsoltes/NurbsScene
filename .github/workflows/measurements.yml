name: Arc length numerical contracts
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  measurements:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.12,<2'
      - run: python tools/generate-length-oracle.py
      - name: Numerical regressions and independent QUADPACK comparisons
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/measurements
          dotnet run --project tests/dotnet/NurbsScene.MeasurementTests -c Release 2>&1 | tee artifacts/measurements/test.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: curve-measurements-${{ github.run_id }}
          path: artifacts/measurements/
