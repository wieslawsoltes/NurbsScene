name: Offline managed test toolchain
on:
  push:
    branches: [feat/parity-kernel]
    paths: [.github/workflows/toolchain.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sdk:
    runs-on: ubuntu-latest
    steps:
      - name: Download the official .NET 10.0.401 Linux SDK and verify its manifest hash
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/offline-dotnet"
          cd "$RUNNER_TEMP/offline-dotnet"
          curl --fail --location --retry 3 --output releases.json https://dotnetcli.blob.core.windows.net/dotnet/release-metadata/10.0/releases.json
          python3 - <<'PY'
          import hashlib,json,pathlib,urllib.request
          releases=json.loads(pathlib.Path('releases.json').read_text())['releases']
          sdks=[s for r in releases for s in r.get('sdks',[r.get('sdk',{})]) if s.get('version')=='10.0.401']
          file=next(f for s in sdks for f in s['files'] if f.get('rid')=='linux-x64' and f['name'].endswith('.tar.gz'))
          expected='https://builds.dotnet.microsoft.com/dotnet/Sdk/10.0.401/dotnet-sdk-10.0.401-linux-x64.tar.gz'
          if file['url']!=expected: raise RuntimeError('Unexpected SDK download URL')
          path=pathlib.Path('dotnet-sdk-10.0.401-linux-x64.tar.gz')
          urllib.request.urlretrieve(expected,path)
          digest=hashlib.sha512(path.read_bytes()).hexdigest()
          if digest.lower()!=file['hash'].lower(): raise RuntimeError('SDK SHA512 mismatch')
          pathlib.Path('SHA512SUMS.txt').write_text(digest+'  '+path.name+'\n')
          print('Verified official SDK SHA512:',digest)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: verified-dotnet-linux-x64
          compression-level: 0
          retention-days: 1
          path: |
            ${{ runner.temp }}/offline-dotnet/dotnet-sdk-10.0.401-linux-x64.tar.gz
            ${{ runner.temp }}/offline-dotnet/SHA512SUMS.txt
